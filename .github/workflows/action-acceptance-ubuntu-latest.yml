name: nightly

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-ubuntu-latest-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: ubuntu-latest action acceptance
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/action-acceptance.yml
    with:
      action_ref: ${{ github.sha }}
      candidate_kind: source
      acceptance_runner: ubuntu-latest
